name: Automate Data Preprocessing

on:
  push:
    branches:
      - main
    paths:
      - "mobile_price_raw/**"
      - "preprocessing/automate_*.py"
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Preprocessing Script
        run: |
          python preprocessing/automate_Rakha-Djauhari.py

      - name: Commit and Push Processed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/mobile_price_preprocessing/
          git commit -m "Auto-update processed dataset [skip ci]" || echo "No changes to commit"
          git push
